<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aleš Hendrych – web a zákazníci z reklamy od jednoho člověka</title>
  <meta name="description" content="Postavím vám web a přivedu na něj zákazníky z Facebooku a Instagramu. Vše od jednoho člověka, bez starostí s koordinací.">

  <!-- Open Graph: jak se stránka zobrazí při sdílení na sociálních sítích -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aleš Hendrych – web a zákazníci z reklamy">
  <meta property="og:description" content="Postavím vám web a přivedu na něj zákazníky z Facebooku a Instagramu.">

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <!-- Značka, že JavaScript běží – podle ní se zapínají animace (bez JS zůstane obsah vidět) -->
  <script>document.documentElement.classList.add('js')</script>

  <!-- Fonty z Google Fonts (latin-ext kvůli české diakritice) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap&subset=latin-ext" rel="stylesheet">

  <!-- Tailwind CSS přes CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Vlastní barvy a fonty pro Tailwind (třídy jako bg-primary-600, text-accent-500, font-display) -->
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;

      /* Primární barva – indigová (důvěra, profesionalita) */
      --color-primary-50: #eef2ff;
      --color-primary-100: #e0e7ff;
      --color-primary-200: #c7d2fe;
      --color-primary-300: #a5b4fc;
      --color-primary-400: #818cf8;
      --color-primary-500: #6366f1;
      --color-primary-600: #4f46e5;
      --color-primary-700: #4338ca;
      --color-primary-800: #3730a3;
      --color-primary-900: #312e81;

      /* Akcentová barva – korálová (jen tlačítka a důležité detaily) */
      --color-accent-400: #fb8a6e;
      --color-accent-500: #f76b4f;
      --color-accent-600: #e5533a;
    }
  </style>

  <link rel="stylesheet" href="css/custom.css">
  <script src="js/main.js" defer></script>
</head>
<body class="bg-white font-sans text-slate-900 antialiased">

  <header>
    <p class="font-display text-xl font-bold">Aleš Hendrych</p>
  </header>

  <main>
    <section id="uvod">
      <h2 class="font-display text-3xl font-bold">Úvod</h2>
    </section>

    <section id="proc">
      <h2 class="font-display text-3xl font-bold">Proč se vám ozve víc zákazníků</h2>
    </section>

    <section id="sluzby">
      <h2 class="font-display text-3xl font-bold">Služby</h2>
    </section>

    <section id="spoluprace">
      <h2 class="font-display text-3xl font-bold">Jak spolupracujeme</h2>
    </section>

    <section id="reference">
      <h2 class="font-display text-3xl font-bold">Reference</h2>
    </section>

    <section id="faq">
      <h2 class="font-display text-3xl font-bold">Časté otázky</h2>
    </section>

    <section id="o-mne">
      <h2 class="font-display text-3xl font-bold">O mně</h2>
    </section>

    <section id="kontakt">
      <h2 class="font-display text-3xl font-bold">Kontakt</h2>
    </section>
  </main>

  <footer>
    <p>© <span data-year>2026</span> Aleš Hendrych</p>
  </footer>

</body>
</html>
